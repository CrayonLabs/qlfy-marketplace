name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./plugins/qlfy
      - name: Plugin version header matches plugin.json
        run: |
          version=$(jq -r '.version' plugins/qlfy/.claude-plugin/plugin.json)
          header=$(jq -r '.mcpServers.qlfy.headers["X-Qlfy-Plugin-Version"]' plugins/qlfy/.mcp.json)
          test "$version" = "$header" || { echo "X-Qlfy-Plugin-Version is $header, plugin.json is $version"; exit 1; }
